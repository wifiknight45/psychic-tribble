Psychic-tribble
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

Psychic-tribble
name = "psychic-tribble"
version = "1.0.0"
description = "Backend for event scheduling with FastAPI and iCalendar export"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.70.0",
  "uvicorn[standard]>=0.15.0",
  "sqlalchemy>=1.4.0",
  "alembic>=1.7.0",
  "pydantic>=1.8.0",
  "passlib[bcrypt]>=1.7.0",
  "python-jose[cryptography]>=3.2.0",
  "slowapi>=0.1.4",
  "redis>=4.0.0",
  "icalendar>=4.0.0",
  "pytz>=2021.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=6.2",
  "pytest-cov",
  "flake8",
  "mypy",
  "black",
]

[project.urls]
"Homepage" = "https://github.com/wifiknight45/psychic-tribble"
"Repository" = "https://github.com/wifiknight45/psychic-tribble"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "venv*", ".env*"]

[project.scripts]
psychic-tribble = "app:app"
