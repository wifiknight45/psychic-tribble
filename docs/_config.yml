# Site settings
title: Psychic Tribble
email: wifiknight45@proton.me
description: >-
  A mystical calendar + task management suite that reveals patterns through Python and Jekyll.
baseurl: "https://wifiknight45.github.io/psychic-tribble"      # your repo name
url: "https://wifiknight45.github.io/psychic-tribble"

github_username: wifiknight45

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Include the JSON data generated by your calendar.py
include:
  - _data/calendar.json

# Exclude files that Jekyll shouldn’t process
exclude:
  - .github/
  - requirements.txt
  - requirements.dev.txt

# Markdown engine
markdown: kramdown

