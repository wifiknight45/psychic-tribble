<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psychic Tribble</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/psychic-tribble/static/css/style.css">
</head>
<body>
  <header>
    <h1>Psychic Tribble</h1>
    <p>Plan your events with a futuristic twist!</p>
    <nav>
      <a href="#events">Events</a>
      <a href="#calendar">Calendar</a>
      <a href="#profile">Profile</a>
    </nav>
  </header>

  <div class="container">
    <section id="login">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" id="username" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </section>

    <section id="create-event" style="display: none;">
      <h2>Create Event</h2>
      <form id="event-form">
        <input type="text" id="event-title" placeholder="Event Title" required>
        <textarea id="event-desc" placeholder="Description"></textarea>
        <input type="datetime-local" id="event-start" required>
        <input type="datetime-local" id="event-end" required>
        <button type="submit">Add Event</button>
      </form>
    </section>

    <section id="events">
      <h2>Events</h2>
      <div class="event-grid"></div>
    </section>

    <section id="calendar">
      <h2>Calendar</h2>
      <div id="calendar-view"></div>
    </section>

    <section id="profile" style="display: none;">
      <h2>Profile</h2>
      <p id="profile-info">Log in to view your profile.</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
  <script src="/psychic-tribble/static/js/app.js"></script>
</body>
</html>
