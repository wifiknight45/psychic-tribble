name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Secret Detection
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Dependency Vulnerability Scanning
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      - name: Run Safety check
        run: |
          pip install -r requirements.txt
          safety check --json --output safety-report.json || true
          safety check

      - name: Run pip-audit
        run: |
          pip-audit --format=json --output=pip-audit-report.json
          pip-audit

      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: safety-report
          path: safety-report.json

      - name: Upload pip-audit report  
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # Static Application Security Testing (SAST)
  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] semgrep

      - name: Run Bandit security linter
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll -i

      - name: Run Semgrep
        run: |
          semgrep --config=auto --json --output=semgrep-report.json src/ || true
          semgrep --config=auto src/

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-report
          path: semgrep-report.json

  # Code Quality and Security Linting
  security-lint:
    name: Security Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 mypy

      - name: Run Ruff security checks
        run: |
          ruff check src/ tests/ --select=S --format=json --output-file=ruff-security.json || true
          ruff check src/ tests/ --select=S

      - name: Run flake8 security checks
        run: |
          # Critical security issues (will fail the build)
          flake8 src/ tests/ --select=E9,F63,F7,F82,B --show-source --statistics
          # All security and quality issues
          flake8 src/ tests/ --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run mypy type checking
        run: |
          mypy src/ --ignore-missing-imports || true

      - name: Upload Ruff security report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ruff-security-report
          path: ruff-security.json

  # Container Security Scanning
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t psychic-tribble:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'psychic-tribble:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # CodeQL Analysis
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:${{matrix.language}}"

  # Security Configuration Audit
  config-audit:
    name: Security Configuration Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit Docker configuration
        run: |
          # Check for security best practices in Dockerfile
          if [ -f "Dockerfile" ]; then
            echo "Auditing Dockerfile security..."
            
            # Check for non-root user
            if ! grep -q "USER " Dockerfile; then
              echo "WARNING: Dockerfile does not specify non-root user"
              exit 1
            fi
            
            # Check for COPY --chown usage
            if ! grep -q "COPY --chown" Dockerfile; then
              echo "WARNING: COPY commands should use --chown for security"
            fi
            
            # Check for health check
            if ! grep -q "HEALTHCHECK" Dockerfile; then
              echo "WARNING: Dockerfile missing HEALTHCHECK instruction"
            fi
          fi

      - name: Audit GitHub Actions security
        run: |
          # Check for pinned action versions
          echo "Auditing GitHub Actions security..."
          find .github/workflows -name "*.yml" -o -name "*.yaml" | while read file; do
            if grep -q "uses:.*@[^v]" "$file"; then
              echo "WARNING: $file contains unpinned action versions"
            fi
          done

      - name: Check environment file security
        run: |
          # Ensure .env files are not committed
          if ls .env* 1> /dev/null 2>&1; then
            echo "ERROR: .env files found in repository"
            ls -la .env*
            exit 1
          fi
          
          # Ensure .env.example exists
          if [ ! -f ".env.example" ]; then
            echo "WARNING: .env.example file not found"
          fi

  # Security Test Suite
  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_psychic_tribble
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Set up test environment
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_psychic_tribble
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-security-testing-at-least-64-characters-long
          ENV: testing
        run: |
          # Run database migrations
          alembic upgrade head

      - name: Run security-focused tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_psychic_tribble
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-security-testing-at-least-64-characters-long
          ENV: testing
        run: |
          # Run tests with focus on security
          pytest tests/ -v -k "security or auth or permission" --cov=src/psychic_tribble --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: security-tests
          name: security-test-coverage

  # Generate Security Report
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    if: always()
    needs: [secret-scan, dependency-scan, sast-scan, security-lint, container-scan, config-audit, security-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Scan Date:** $(date)" >> security-summary.md
          echo "**Commit:** ${{ github.sha }}" >> security-summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> security-summary.md
          echo "" >> security-summary.md
          
          # Add individual scan results
          echo "## Scan Results" >> security-summary.md
          echo "" >> security-summary.md
          
          if [ -f "safety-report/safety-report.json" ]; then
            echo "### Dependency Vulnerabilities (Safety)" >> security-summary.md
            python -c "
import json
with open('safety-report/safety-report.json', 'r') as f:
    data = json.load(f)
    if data:
        print(f'- Found {len(data)} vulnerabilities')
        for vuln in data[:5]:  # Show first 5
            print(f'  - {vuln.get(\"advisory\", \"Unknown\")}')
    else:
        print('- No vulnerabilities found')
" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          if [ -f "bandit-report/bandit-report.json" ]; then
            echo "### Static Analysis Security Issues (Bandit)" >> security-summary.md
            python -c "
import json
with open('bandit-report/bandit-report.json', 'r') as f:
    data = json.load(f)
    results = data.get('results', [])
    print(f'- Found {len(results)} potential security issues')
    high_issues = [r for r in results if r.get('issue_severity') == 'HIGH']
    if high_issues:
        print(f'- {len(high_issues)} high severity issues found')
" >> security-summary.md
            echo "" >> security-summary.md
          fi

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-summary
          path: security-summary.md

      - name: Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('security-summary.md')) {
              const summary = fs.readFileSync('security-summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }

  # Notify on security issues
  notify-security:
    name: Security Notification
    runs-on: ubuntu-latest
    if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: [secret-scan, dependency-scan, sast-scan, security-lint, container-scan, config-audit, security-tests]
    steps:
      - name: Notify security team
        run: |
          echo "Security scan failed for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          # Add actual notification logic (Slack, email, etc.)
