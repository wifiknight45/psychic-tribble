name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          echo "Running critical lint checks (E9,F63,F7,F82)"
          flake8 psychic_tribble tests --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=psychic_tribble/db/migrations,venv,__pycache__
          echo "Running full lint checks with relaxed exit code"
          flake8 psychic_tribble tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=psychic_tribble/db/migrations,venv,__pycache__

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx  # Added httpx for testing template endpoints

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        working-directory: psychic_tribble
        run: |
          alembic upgrade head

      - name: Run tests with pytest
        env:
          PYTHONPATH: psychic_tribble
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          PYTT_ENV: test
          SECRET_KEY: test-secret-key
        run: |
          pytest tests --cov=psychic_tribble --cov-report=xml --maxfail=1 -v --disable-warnings

      - name: Test template rendering
        env:
          PYTHONPATH: psychic_tribble
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          PYTT_ENV: test
          SECRET_KEY: test-secret-key
        run: |
          uvicorn psychic_tribble.main:app --host 0.0.0.0 --port 8000 &
          sleep 5  # Wait for server to start
          curl --fail http://localhost:8000/calendar || exit 1
          pkill -f uvicorn  # Stop the server
        continue-on-error: true  # Temporary, until template routes are confirmed

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
