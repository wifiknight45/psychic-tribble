name: Docker Test

on: [push, pull_request]

jobs:
  test-with-docker:
    runs-on: ubuntu-latest
    # Optional: tighten permissions for security
    permissions:
      contents: read

    env:
      # Adjust if your compose file or service name differs
      COMPOSE_FILE: docker-compose.yml
      WEB_SERVICE: web
      # How long to wait (seconds) for the web service to report healthy
      HEALTH_TIMEOUT: "180"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show Docker/Compose versions
        run: |
          docker version
          docker compose version

      - name: Build and start services
        run: |
          # Build and start in the background
          docker compose up -d --build
          docker compose ps

      - name: Wait for web service health (with timeout)
        shell: bash
        run: |
          set -euo pipefail
          SVC="${WEB_SERVICE}"

          # If no healthcheck is defined, we’ll just wait a bit and continue.
          CID="$(docker compose ps -q "$SVC" || true)"
          if [[ -z "${CID}" ]]; then
            echo "Service '$SVC' not found. Available services:"
            docker compose ps
            exit 1
          fi

          echo "Waiting up to ${HEALTH_TIMEOUT}s for '$SVC' to become healthy..."
          end=$((SECONDS + HEALTH_TIMEOUT))
          health="unknown"

          while (( SECONDS < end )); do
            # If a healthcheck exists, this returns 'healthy'|'unhealthy'|'starting'.
            if health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CID" 2>/dev/null); then
              if [[ "$health" == "healthy" ]]; then
                echo "'$SVC' is healthy."
                break
              elif [[ "$health" == "no-healthcheck" ]]; then
                echo "'$SVC' has no healthcheck; waiting 15s fallback, then proceeding."
                sleep 15
                health="proceeding"
                break
              else
                echo "Current health: $health — waiting..."
              fi
            else
              echo "Container not inspectable yet — waiting..."
            fi
            sleep 5
          done

          if [[ "$health" != "healthy" && "$health" != "proceeding" ]]; then
            echo "Timed out waiting for '$SVC' to become healthy."
            echo "Recent logs:"
            docker compose logs --no-color --tail=200 "$SVC" || true
            exit 1
          fi

          echo "Final compose status:"
          docker compose ps

      - name: Run tests in web container
        # -T disables TTY, important in CI
        run: |
          docker compose exec -T "${WEB_SERVICE}" pytest -q

      - name: Capture Docker logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/docker-logs.txt || true
          # Per-service logs (helps pinpoint which service failed)
          for s in $(docker compose ps --services); do
            docker compose logs --no-color "$s" > "artifacts/${s}.log" || true
          done

      - name: Upload logs artifact (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: artifacts/

      - name: Tear down containers
        if: always()
        run: |
          docker compose down -v --remove-orphans

