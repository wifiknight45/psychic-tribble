version: 2
updates:
  # Weekly Python dependency updates
  - package-ecosystem: "pip"
    directory: "/" 
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"

  # Weekly GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
